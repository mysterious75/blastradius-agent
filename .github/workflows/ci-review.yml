# Reusable BlastRadius CI security & quality gate (GitHub Actions template).
#
# What it does on every pull request:
#   1. checks out the PR merge commit (read-only; no secrets to forks),
#   2. collects the PR diff (base...head),
#   3. runs deterministic BlastRadius analyzers over changed files
#      (+ optional Claude AI review when ANTHROPIC_API_KEY is configured),
#   4. evaluates the deterministic policy (blastradius-ci.yml),
#   5. publishes JSON + Markdown reports and a job summary,
#   6. fails the workflow on POLICY_FAILURE or ANALYSIS_ERROR.
#
# Fork safety: this workflow uses the `pull_request` event (not
# `pull_request_target`), runs with least privilege (contents: read), never
# executes PR code, and never posts comments (no write permissions needed).
# On fork PRs, repository secrets are unavailable, so the gate runs in
# deterministic-only mode automatically — still useful, never silently safe:
# oversized/unreadable diffs fail closed.
#
# Adoption:
#   1. copy this file into your repo as .github/workflows/ci-review.yml,
#   2. add an optional `blastradius-ci.yml` policy (defaults are safe),
#   3. optionally add the ANTHROPIC_API_KEY repository secret for AI review,
#   4. enable branch protection with this workflow as a required status check.
#
# Third-party actions below are pinned to immutable commit SHAs.

name: ci-security-quality-gate

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  ci-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0 # diff-scope needs full history

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Install BlastRadius
        run: pip install -e ".[dev]"

      - name: Run CI security & quality gate
        id: gate
        env:
          # Optional: enables Claude AI review. On fork PRs this secret is
          # absent and the gate runs deterministic-only (still gated).
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          BLASTRADIUS_AI_MODEL: ${{ vars.BLASTRADIUS_AI_MODEL }}
        run: |
          POLICY="blastradius-ci.yml"
          if [ ! -f "$POLICY" ]; then POLICY="blastradius-ci.example.yml"; fi
          python -m blastradius.ci gate \
            --repo "$GITHUB_WORKSPACE" \
            --base "origin/${{ github.event.pull_request.base.ref }}" \
            --policy "$POLICY" \
            --out ci-gate \
            --run-ref "${{ github.repository }}#${{ github.event.pull_request.number }}"

      - name: Upload gate reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ci-gate-reports
          path: ci-gate/
