name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 2 * * 1'   # weekly hunt (Monday 2am)
    - cron: '0 8 * * *'   # daily dependency check (8am)

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e ".[dev]"
      - name: Ruff lint
        run: ruff check blastradius tests scripts
      - name: Ruff format check
        run: ruff format --check blastradius tests scripts

  security_scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e ".[dev]"
      - name: Bandit security scan
        # Medium+ gate. Skips: B608 (internal dynamic SQL, no user input),
        # B310 (HTTP-client by design, URLs pre-validated), B104 (servers
        # default to loopback; remaining hits are SSRF blocklist/docstrings).
        run: bandit -q -r blastradius -ll -s B608,B310,B104

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      # BlastRadius is self-contained — no external scanner repo needed.
      - name: Install
        run: pip install -e ".[dev]"

      - name: Run tests with coverage
        run: pytest tests/ -v --tb=short --cov=blastradius --cov-report=xml --cov-fail-under=60

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report-${{ matrix.python-version }}
          path: coverage.xml

  benchmark:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e ".[dev]"
      - name: Build sandbox image (best-effort)
        run: docker build -t blastradius-sandbox sandbox/
        continue-on-error: true
      - name: "Run verified benchmark (CI gate: F1 >= 0.5)"
        run: python benchmarks/run.py --verify --min-f1 0.5
      - name: Upload benchmark report
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-report
          path: benchmarks/results/**

  scheduled_hunt:
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e ".[all]"
      - name: Run scheduled auto-hunt (pypi targets)
        run: python -m blastradius.auto_hunt --strategy pypi --max 5
      - name: Export findings to SARIF
        run: python -m blastradius.export --format sarif --output report.sarif || true
      - name: Upload SARIF to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        if: hashFiles('report.sarif') != ''
        with:
          sarif_file: report.sarif
      - name: Upload hunt reports
        uses: actions/upload-artifact@v4
        with:
          name: hunt-reports
          path: reports/**
      - name: File issue if findings
        run: |
          if ls reports/ >/dev/null 2>&1 && [ -n "$(ls reports/ 2>/dev/null)" ]; then
            gh issue create --repo "${GITHUB_REPOSITORY}" \
              --title "BlastRadius weekly auto-hunt findings" \
              --body "New reports were generated — see the hunt-reports artifact." || true
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  dependency_check:
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Check our own dependencies against OSV
        run: python scripts/osv_check.py

  publish:
    needs: test
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install build tooling
        run: pip install build
      - name: Build wheel + sdist
        run: python -m build
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}
