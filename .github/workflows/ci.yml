name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 2 * * 1'   # weekly hunt (Monday 2am)
    - cron: '0 8 * * *'   # daily dependency check (8am)

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # BlastRadius is self-contained — no prometheus clone needed.
      - name: Install
        run: pip install -e ".[dev]"

      - name: Run tests with coverage
        run: pytest tests/ -v --tb=short --cov=blastradius --cov-report=xml

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report-${{ matrix.python-version }}
          path: coverage.xml

  scheduled_hunt:
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e ".[all]"
      - name: Run scheduled auto-hunt (pypi targets)
        run: python -m blastradius.auto_hunt --strategy pypi --max 5
      - name: Upload hunt reports
        uses: actions/upload-artifact@v4
        with:
          name: hunt-reports
          path: reports/**
      - name: File issue if findings
        run: |
          if ls reports/ >/dev/null 2>&1 && [ -n "$(ls reports/ 2>/dev/null)" ]; then
            gh issue create --repo "${GITHUB_REPOSITORY}" \
              --title "BlastRadius weekly auto-hunt findings" \
              --body "New reports were generated — see the hunt-reports artifact." || true
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  dependency_check:
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check our own dependencies against OSV
        run: python scripts/osv_check.py
