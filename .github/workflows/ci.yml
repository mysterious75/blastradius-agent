name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 2 * * 1'   # weekly hunt (Monday 2am)
    - cron: '0 8 * * *'   # daily dependency check (8am)

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e ".[dev]"
      - name: Ruff lint
        run: ruff check blastradius tests scripts
      - name: Ruff format check
        run: ruff format --check blastradius tests scripts

  security_scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e ".[dev]"
      - name: Bandit security scan
        # Medium+ gate. Skips: B608 (internal dynamic SQL, no user input),
        # B310 (HTTP-client by design, URLs pre-validated), B104 (servers
        # default to loopback; remaining hits are SSRF blocklist/docstrings).
        run: bandit -q -r blastradius -ll -s B608,B310,B104

  dependency_audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Install project (all extras) + audit tool
        run: pip install -e ".[all]" pip-audit
      - name: Audit the installed dependency closure (fail closed)
        run: |
          python -m pip freeze --exclude-editable > "$RUNNER_TEMP/requirements.txt"
          pip-audit --strict -r "$RUNNER_TEMP/requirements.txt"

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}

      # BlastRadius is self-contained — no external scanner repo needed.
      - name: Install
        run: pip install -e ".[dev]"

      - name: Run tests with coverage
        run: pytest tests/ -v --tb=short --cov=blastradius --cov-report=xml --cov-fail-under=80

      - name: Upload coverage report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: coverage-report-${{ matrix.python-version }}
          path: coverage.xml

  test_windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e ".[dev]"
      - name: Run tests (Windows path/encoding regressions)
        run: pytest tests/ -q

  benchmark:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e ".[dev]"
      # The sandbox image must build: --verify proves exploits inside it,
      # so a broken Dockerfile must fail the pipeline (fail-closed), never
      # silently fall back to unsandboxed local execution.
      - name: Build sandbox image
        run: docker build -t blastradius-sandbox sandbox/
      - name: "Run verified benchmark (CI gate: F1 >= 0.5)"
        run: python benchmarks/run.py --verify --min-f1 0.5
      - name: "Run dynamic benchmark (CI gate: F1 >= 1.0)"
        run: python benchmarks/run_dynamic.py --min-f1 1.0
      - name: Upload benchmark report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: benchmark-report
          path: benchmarks/results/**

  scheduled_hunt:
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e ".[all]"
      # Fail-closed scope needs a registered program, and non-interactive
      # clones need credentials. The heartbeat hunt therefore runs over
      # FIXED deliberately-vulnerable training repos (never random PyPI
      # metadata URLs, whose dead/suffixed links used to make git prompt
      # for credentials and kill the job). GITHUB_TOKEN is auto-provided
      # by Actions — no manual secret setup required.
      - name: Register CI training scope
        run: |
          mkdir -p ~/.blastradius/scopes
          printf '%s' '{"program":"ci-training","in_scope":["https://github.com/WebGoat/WebGoat","https://github.com/digininja/DVWA","https://github.com/juice-shop/juice-shop"],"out_of_scope":[],"notes":"deliberately vulnerable training apps for the scheduled heartbeat hunt"}' > ~/.blastradius/scopes/ci-training.json
      - name: Configure git credentials
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: git config --global url."https://x-access-token:${GITHUB_TOKEN}@github.com/".insteadOf "https://github.com/"
      - name: Run scheduled auto-hunt (training targets)
        run: >-
          python -m blastradius.auto_hunt --scope ci-training
          --repo https://github.com/WebGoat/WebGoat
          --repo https://github.com/digininja/DVWA
          --repo https://github.com/juice-shop/juice-shop
          --max 3
      - name: Export findings to SARIF
        run: python -m blastradius.export --format sarif --output report.sarif || true
      - name: Upload SARIF to GitHub Security
        uses: github/codeql-action/upload-sarif@4bfa242aa49c5f7c6770b98670d354a7dfac05f8 # v3
        if: hashFiles('report.sarif') != ''
        with:
          sarif_file: report.sarif
      - name: Upload hunt reports
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: hunt-reports
          path: reports/**
      - name: File issue if findings
        run: |
          if ls reports/ >/dev/null 2>&1 && [ -n "$(ls reports/ 2>/dev/null)" ]; then
            gh issue create --repo "${GITHUB_REPOSITORY}" \
              --title "BlastRadius weekly auto-hunt findings" \
              --body "New reports were generated — see the hunt-reports artifact." || true
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  dependency_check:
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Check our own dependencies against OSV
        run: python scripts/osv_check.py

  publish:
    needs: test
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Install build tooling
        run: pip install build
      - name: Build wheel + sdist
        run: python -m build
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # release/v1
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}
