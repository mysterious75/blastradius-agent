name: Deploy site to GitHub Pages

on:
  # Pages is not enabled on this repository yet; automatic runs would fail.
  # Enable Pages (Settings → Pages → GitHub Actions) then restore the push
  # trigger below.
  # push:
  #   branches: [main]
  #   paths:
  #     - "docs/**"
  #     - ".github/workflows/pages.yml"
  workflow_dispatch:

# Least privilege: this workflow only builds and uploads the static docs/ folder.
# It makes no external requests beyond the Pages upload.
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Upload static site
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: docs

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
