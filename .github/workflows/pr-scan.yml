name: pr-security-scan

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write # autofix bot pushes a fix branch
  pull-requests: write
  security-events: write

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0 # diff-scope needs full history

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Install
        run: pip install -e ".[all]"

      - name: Build sandbox image (best-effort)
        run: docker build -t blastradius-sandbox sandbox/
        continue-on-error: true

      - name: Fetch CISA KEV feed (best-effort)
        continue-on-error: true
        run: curl -fsSL https://www.cisa.gov/sites/default/files/feeds/known_exploited_vulnerabilities.json -o kev.json

      - name: Run PR security scan
        id: scan
        env:
          # Optional: enables AI patches; without keys rule-based patches run
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python scripts/pr_scan.py --repo "$GITHUB_WORKSPACE" --base "origin/${{ github.event.pull_request.base.ref }}" --baseline-ref "origin/${{ github.event.pull_request.base.ref }}" --fail-on high --kev-file kev.json --out "$GITHUB_WORKSPACE/pr-scan"

      - name: Upload SARIF to code scanning
        if: ${{ always() && hashFiles('pr-scan/pr-scan.sarif') != '' }}
        uses: github/codeql-action/upload-sarif@4bfa242aa49c5f7c6770b98670d354a7dfac05f8 # v3
        with:
          sarif_file: pr-scan/pr-scan.sarif

      - name: Comment findings on PR
        if: always()
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          script: |
            const fs = require('fs');
            const path = 'pr-scan/pr-comment.md';
            if (!fs.existsSync(path)) { console.log('no comment body produced'); return; }
            const body = fs.readFileSync(path, 'utf8');
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: body.slice(0, 65000)
            });

      - name: Open autofix PRs (bot)
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -f pr-scan/pr-results.json ]; then
            python scripts/autofix_pr.py \
              --results pr-scan/pr-results.json \
              --repo "$GITHUB_WORKSPACE" \
              --base "${{ github.event.pull_request.base.ref }}" \
              --pr "${{ github.event.pull_request.number }}"
          fi
