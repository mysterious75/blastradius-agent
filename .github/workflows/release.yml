name: Release

# Tag-push release pipeline (PEP 740 / SLSA / Sigstore supply-chain story).
# For every `v*` tag: build wheel + sdist, generate a CycloneDX SBOM, sign the
# artifacts with Sigstore (keyless OIDC), create a SLSA v1 Build Level 3
# provenance attestation, attach the attestations + SBOM to the GitHub release,
# and publish to PyPI via Trusted Publishing (OIDC — no password/token).

on:
  push:
    tags:
      - "v*"

permissions:
  id-token: write
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    # contents: write    — attach attestation/SBOM assets to the GitHub release
    # id-token: write    — OIDC for Sigstore keyless signing + PyPI trusted publishing
    # attestations: write — store SLSA provenance in the repo attestation store
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tooling
        run: pip install build

      - name: Build wheel + sdist
        run: python -m build

      # SBOM generation is best-effort: a failure must not block publishing.
      # NOTE: syft is a Go binary, not a PyPI package — install via the
      # Anchore action, not `pip install syft` (which yields an empty file
      # and fails the attach step on 0-byte validation).
      # NOTE 2: scan the source tree (./), not dist/: syft catalogs Python
      # dependencies from pyproject.toml, while a built wheel is opaque and
      # yields a near-empty SBOM.
      - name: Generate CycloneDX SBOM
        continue-on-error: true
        uses: anchore/sbom-action@v0
        with:
          path: ./
          format: cyclonedx-json
          output-file: sbom.cdx.json

      - name: Drop empty SBOM so attach never fails on 0-byte assets
        run: |
          if [ ! -s sbom.cdx.json ]; then echo "SBOM empty/missing - skipping attach"; rm -f sbom.cdx.json; fi

      # Fail-closed release verification: license metadata for every
      # distribution, plus CycloneDX structure/component validation whenever
      # an SBOM was produced. A missing SBOM still checks distributions.
      - name: Verify release distributions and SBOM
        run: |
          if [ -f sbom.cdx.json ]; then
            python scripts/verify_release.py dist/* --sbom sbom.cdx.json --require-sbom-components
          else
            python scripts/verify_release.py dist/*
          fi

      # Sigstore keyless signing (Fulcio OIDC cert + Rekor log) — produces a
      # PEP 740-compatible bundle (<artifact>.sigstore). Best-effort.
      - name: Sigstore sign artifacts
        continue-on-error: true
        run: |
          pip install sigstore || true
          python -m sigstore sign dist/* || true

      # GitHub-native SLSA v1 Build Level 3 provenance for every artifact.
      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: dist/*

      - name: Attach SBOM + sigstore bundles to release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            sbom.cdx.json
            dist/*.sigstore

      # Trusted Publishing: PyPI maps the GitHub Actions OIDC identity, so no
      # password / API token is required (PEP 740 attestations are generated
      # index-side for every uploaded file).
      #
      # OPTIONAL until there is real `pip install` demand: requires a Trusted
      # Publisher configured on PyPI (project settings). Until then this step
      # is best-effort so a missing PyPI setup never fails the release —
      # GitHub Releases (wheel/sdist/SBOM/signatures) remain the channel.
      - name: Publish to PyPI (trusted publishing)
        continue-on-error: true
        uses: pypa/gh-action-pypi-publish@release/v1
