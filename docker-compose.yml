# BlastRadius Agent — full stack.
#
#   docker compose up --build
#   → dashboard at http://localhost:8080, REST API at :8001
#
# The sandbox service uses the gVisor runtime (runsc) when installed on the
# host; remove the `runtime:` line to fall back to runc.

services:
  blastradius:
    build: .
    ports:
      - "8080:8080"   # dashboard
    volumes:
      - ~/.blastradius:/root/.blastradius   # SQLite DB + learned rules
    env_file: .env

  api:
    build: .
    ports:
      - "8001:8001"   # REST API
    volumes:
      - ~/.blastradius:/root/.blastradius
    env_file: .env
    command: ["python", "-m", "blastradius.api", "--port", "8001"]

  sandbox:
    build: sandbox/
    # gVisor syscall interception (optional — falls back to runc if removed)
    runtime: runsc
    network_mode: none
