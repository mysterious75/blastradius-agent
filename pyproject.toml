[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "blastradius-agent"
version = "1.0.0"
description = "Autonomous security engineer: Prometheus scanners wrapped as CAI function_tools"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
keywords = ["security", "pentest", "vulnerability", "scanner", "ai", "agent", "cai", "cve"]
dependencies = [
    "cai-framework>=0.5.0",
    "python-dotenv>=1.0.0",
    "openai>=1.50.0",
    "fastapi>=0.110.0",
    "uvicorn>=0.29.0",
]

[project.optional-dependencies]
all = [
    "cai-framework>=0.5.0",
    "python-dotenv>=1.0.0",
    "openai>=1.50.0",
    "fastapi>=0.110.0",
    "uvicorn>=0.29.0",
    "websockets>=12.0",
    "APScheduler>=3.10",
]
scheduler = [
    "APScheduler>=3.10",
]
dashboard = [
    "fastapi>=0.110.0",
    "uvicorn>=0.29.0",
    "websockets>=12.0",
]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "httpx>=0.27.0",
]

[project.scripts]
blastradius-scan = "blastradius.hunter.cli:main"
blastradius-blast = "blastradius.blast_radius.cli:main"
blastradius-server = "blastradius.github_app.webhook:start"
blastradius-hunt = "scripts.cve_hunt:main"

[tool.setuptools.packages.find]
include = ["blastradius*", "scripts*"]
