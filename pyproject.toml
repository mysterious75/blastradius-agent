[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "blastradius-agent"
version = "1.0.0"
description = "Autonomous security engineer — scan, prove, patch, verify"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
keywords = ["security", "vulnerability", "CVE", "pentest", "AI", "autonomous"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "Topic :: Security",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "python-dotenv>=1.0.0",
    "openai>=1.50.0",
    "fastapi>=0.110.0",
    "uvicorn>=0.29.0",
    "rich>=13.0.0",
]

[project.optional-dependencies]
all = [
    "python-dotenv>=1.0.0",
    "openai>=1.50.0",
    "fastapi>=0.110.0",
    "uvicorn>=0.29.0",
    "websockets>=12.0",
    "APScheduler>=3.10",
    "questionary>=2.0.0",
    "mcp>=1.0",
]
scheduler = [
    "APScheduler>=3.10",
]
cli = [
    "questionary>=2.0.0",
]
mcp = [
    "mcp>=1.0",
]
dashboard = [
    "fastapi>=0.110.0",
    "uvicorn>=0.29.0",
    "websockets>=12.0",
]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "httpx>=0.27.0",
    "build>=1.0.0",
    "twine>=5.0.0",
    "ruff>=0.4.0",
    "bandit>=1.7.0",
]

[project.scripts]
blastradius = "blastradius.cli.main:main"
blastradius-scan = "blastradius.hunter.cli:main"
blastradius-blast = "blastradius.blast_radius.cli:main"
blastradius-server = "blastradius.github_app.webhook:start"
blastradius-hunt = "scripts.cve_hunt:main"

[project.urls]
Homepage = "https://github.com/mysterious75/blastradius-agent"
Repository = "https://github.com/mysterious75/blastradius-agent"
"Bug Tracker" = "https://github.com/mysterious75/blastradius-agent/issues"
Documentation = "https://github.com/mysterious75/blastradius-agent#readme"

[tool.setuptools.packages.find]
include = ["blastradius*", "scripts*"]

[tool.ruff]
line-length = 100
target-version = "py311"
